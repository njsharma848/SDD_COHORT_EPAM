[project]
name = "calorie-tracker"
version = "0.1.0"
description = "A single-user CLI calorie and nutrition tracker (SDD cohort Assignment 1)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calorie_tracker"]
